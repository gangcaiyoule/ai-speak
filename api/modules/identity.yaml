openapi: 3.0.3
info:
  title: SpeakUp Identity API
  version: 1.0.0
paths:
  /v1/auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '400': {description: Invalid request}
        '409': {description: Registration unavailable}
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {description: Invalid credentials}
  /v1/auth/logout:
    post:
      operationId: logout
      security: [{bearerAuth: []}]
      responses: {'204': {description: No content}, '401': {description: Authentication required}}
  /v1/me:
    get:
      operationId: currentUser
      security: [{bearerAuth: []}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {description: Authentication required}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 128}
    User:
      type: object
      required: [id, email]
      properties:
        id: {type: string}
        email: {type: string, format: email}
    Session:
      type: object
      required: [id, user, token]
      properties:
        id: {type: string}
        user: {$ref: '#/components/schemas/User'}
        token: {type: string, pattern: '^sess_'}
