image: golang:1.22

stages:
  - verify

variables:
  GOPROXY: https://proxy.golang.org,direct

cache:
  paths:
    - /go/pkg/mod

go-verify:
  stage: verify
  image: golang:1.22
  before_script:
    - cd server
    - go version
    - go mod download
  script:
    - go test ./...
    - go vet ./...
    - go build ./...

flutter-verify:
  stage: verify
  image: ghcr.io/cirruslabs/flutter:3.35.2
  before_script:
    - cd mobile
    - flutter --version
    - flutter pub get
  script:
    - flutter analyze
    - flutter test
